<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Chatbot</title>

    <style>

        body{
            margin:0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg,#0f172a,#1e293b);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .chat-container{
            width:350px;
            height:600px;
            background:white;
            border-radius:20px;
            overflow:hidden;
            display:flex;
            flex-direction:column;
            box-shadow:0px 10px 30px rgba(0,0,0,0.3);
        }

        .header{
            background:#2563eb;
            color:white;
            padding:20px;
            text-align:center;
            font-size:22px;
            font-weight:bold;
        }

        .chat-box{
            flex:1;
            padding:15px;
            overflow-y:auto;
            background:#f1f5f9;
        }

        .mensaje{
            margin:10px 0;
            padding:12px;
            border-radius:15px;
            max-width:75%;
            word-wrap:break-word;
        }

        .usuario{
            background:#2563eb;
            color:white;
            margin-left:auto;
        }

        .bot{
            background:#e2e8f0;
            color:black;
        }

        .input-area{
            display:flex;
            padding:10px;
            border-top:1px solid #ccc;
            background:white;
        }

        input{
            flex:1;
            padding:12px;
            border-radius:10px;
            border:1px solid #ccc;
            outline:none;
            font-size:16px;
        }

        button{
            margin-left:10px;
            padding:12px 18px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

    </style>
</head>
<body>

    <div class="chat-container">

        <div class="header">
            🤖 Mi Chatbot
        </div>

        <div class="chat-box" id="chat-box">

            <div class="mensaje bot">
                Hola 👋
            </div>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="mensaje"
                placeholder="Escribe un mensaje..."
                onkeypress="if(event.key==='Enter') enviarMensaje()"
            >

            <button onclick="enviarMensaje()">
                Enviar
            </button>

        </div>

    </div>

<script>

async function enviarMensaje(){

    let input = document.getElementById("mensaje");
    let mensaje = input.value;

    if(mensaje.trim() === ""){
        return;
    }

    let chatBox = document.getElementById("chat-box");

    // Mensaje usuario
    let mensajeUsuario = document.createElement("div");
    mensajeUsuario.className = "mensaje usuario";
    mensajeUsuario.innerText = mensaje;

    chatBox.appendChild(mensajeUsuario);

    // Limpiar input
    input.value = "";

    // Scroll abajo
    chatBox.scrollTop = chatBox.scrollHeight;

    // Enviar al servidor
    let respuesta = await fetch("/mensaje",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            mensaje:mensaje
        })
    });

    let datos = await respuesta.json();

    // Respuesta bot
    let mensajeBot = document.createElement("div");
    mensajeBot.className = "mensaje bot";
    mensajeBot.innerText = datos.respuesta;

    chatBox.appendChild(mensajeBot);

    // Scroll abajo
    chatBox.scrollTop = chatBox.scrollHeight;
}

</script>

</body>
</html>
