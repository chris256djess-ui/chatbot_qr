<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot WhatsApp</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background:#0b141a;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .chat-container{
            width:100%;
            max-width:400px;
            height:100vh;
            background:#efeae2;
            display:flex;
            flex-direction:column;
        }

        /* HEADER */

        .header{
            background:#202c33;
            color:white;
            padding:15px;
            display:flex;
            align-items:center;
            gap:12px;
            box-shadow:0 2px 5px rgba(0,0,0,0.2);
        }

        .avatar{
            width:45px;
            height:45px;
            border-radius:50%;
            background:#25d366;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:22px;
        }

        .header-info h2{
            font-size:18px;
        }

        .header-info p{
            font-size:12px;
            color:#b0b3b8;
        }

        /* CHAT */

        .chat-box{
            flex:1;
            overflow-y:auto;
            padding:15px;
            background-image:url("https://i.imgur.com/3QZQZ9M.png");
            background-size:cover;
        }

        .mensaje{
            max-width:75%;
            padding:10px 12px;
            margin-bottom:12px;
            border-radius:10px;
            position:relative;
            word-wrap:break-word;
            animation:fadeIn 0.2s ease;
        }

        .usuario{
            background:#d9fdd3;
            margin-left:auto;
            border-top-right-radius:0;
        }

        .bot{
            background:white;
            border-top-left-radius:0;
        }

        .hora{
            display:block;
            text-align:right;
            font-size:11px;
            color:gray;
            margin-top:5px;
        }

        /* INPUT */

        .input-area{
            background:#202c33;
            padding:10px;
            display:flex;
            align-items:center;
            gap:10px;
        }

        input{
            flex:1;
            padding:12px;
            border:none;
            border-radius:25px;
            outline:none;
            font-size:15px;
        }

        button{
            width:50px;
            height:50px;
            border:none;
            border-radius:50%;
            background:#25d366;
            color:white;
            font-size:20px;
            cursor:pointer;
        }

        button:hover{
            background:#20ba5a;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(10px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

    </style>

</head>
<body>

<div class="chat-container">

    <!-- HEADER -->

    <div class="header">

        <div class="avatar">
            🤖
        </div>

        <div class="header-info">
            <h2>Mi Chatbot</h2>
            <p>En línea</p>
        </div>

    </div>

    <!-- CHAT -->

    <div class="chat-box" id="chat-box">

        <div class="mensaje bot">
            Hola 👋 Soy tu chatbot

            <span class="hora">
                12:00
            </span>
        </div>

    </div>

    <!-- INPUT -->

    <div class="input-area">

        <input
            type="text"
            id="mensaje"
            placeholder="Escribe un mensaje"
            onkeypress="if(event.key==='Enter') enviarMensaje()"
        >

        <button onclick="enviarMensaje()">
            ➤
        </button>

    </div>

</div>

<script>

function obtenerHora(){

    let fecha = new Date();

    return fecha.getHours().toString().padStart(2,'0')
        + ":"
        + fecha.getMinutes().toString().padStart(2,'0');
}

async function enviarMensaje(){

    let input = document.getElementById("mensaje");
    let texto = input.value;

    if(texto.trim() === ""){
        return;
    }

    let chatBox = document.getElementById("chat-box");

    // MENSAJE USUARIO

    let mensajeUsuario = document.createElement("div");

    mensajeUsuario.className = "mensaje usuario";

    mensajeUsuario.innerHTML = `
        ${texto}
        <span class="hora">${obtenerHora()}</span>
    `;

    chatBox.appendChild(mensajeUsuario);

    input.value = "";

    chatBox.scrollTop = chatBox.scrollHeight;

    // ENVIAR AL SERVIDOR

    let respuesta = await fetch("/mensaje",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            mensaje:texto
        })

    });

    let datos = await respuesta.json();

    // RESPUESTA BOT

    let mensajeBot = document.createElement("div");

    mensajeBot.className = "mensaje bot";

    mensajeBot.innerHTML = `
        ${datos.respuesta}
        <span class="hora">${obtenerHora()}</span>
    `;

    chatBox.appendChild(mensajeBot);

    chatBox.scrollTop = chatBox.scrollHeight;
}

</script>

</body>
</html>
