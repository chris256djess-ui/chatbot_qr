<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de reportes</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background:white;
            width:100%;
            height:100dvh;
            overflow:hidden;
        }

        .chat-container{
            width:100%;
            max-width:100%;
            height:100dvh;
            background:white;
            display:flex;
            flex-direction:column;
            overflow:hidden;
        }

        /* HEADER */

        .header{
            background:#ffffff;
            color:black;
            padding:15px;
            display:flex;
            align-items:center;
            box-shadow:0 2px 5px rgba(0,0,0,0.1);
            border-bottom:1px solid #d1d7db;
        }

        .header-info h2{
            font-size:18px;
        }

        /* CHAT */

        .chat-box{
            flex:1;
            overflow-y:auto;
            padding:15px;
            background:white;
        }

        .mensaje{
            width:fit-content;
            min-width:80px;
            max-width:75%;
            padding:10px 12px;
            margin-bottom:12px;
            border-radius:10px;
            position:relative;
            word-wrap:break-word;
            animation:fadeIn 0.2s ease;
        }

        .usuario{
            background:#d9fdd3;
            margin-left:auto;
            border-top-right-radius:0;
        }

        .bot{
            background:#f1f1f1;
            border-top-left-radius:0;
        }

        .hora{
            display:block;
            text-align:right;
            font-size:11px;
            color:gray;
            margin-top:5px;
        }

        /* INPUT */

        .input-area{
            background:#f0f2f5;
            padding:10px;
            display:flex;
            align-items:center;
            gap:10px;
            border-top:1px solid #d1d7db;
        }

        input{
            flex:1;
            padding:12px;
            border:none;
            border-radius:25px;
            outline:none;
            font-size:15px;
            background:white;
        }

        button{
            width:50px;
            height:50px;
            border:none;
            border-radius:50%;
            background:#25d366;
            color:white;
            font-size:20px;
            cursor:pointer;
        }

        button:hover{
            background:#20ba5a;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(10px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

    </style>

</head>
<body>

<div class="chat-container">

    <!-- HEADER -->
    <div class="header">
        <div class="header-info">
            <h2>Ñätho AquaGuard</h2>
        </div>
    </div>

    <!-- CHAT -->
    <div class="chat-box" id="chat-box">

        <!-- MENSAJE DE BIENVENIDA -->
        <div class="mensaje bot">
            ¡Hola, buen día!👋<br><br>
            Gracias por comunicarte con Ñätho AquaGuard, te atiende tu amigo Ñäthito 
            y será un gusto proporcionarte mi ayuda.<br><br>
            Te solicitare algunos datos para mantener registro de tu reporte, cuando estes listo, saludame!!!👋😁<br>


            <span class="hora" id="hora-bienvenida"></span>
        </div>

    </div>

    <!-- INPUT -->
    <div class="input-area">

        <input
            type="text"
            id="mensaje"
            placeholder="Escribe un mensaje"
            onkeypress="if(event.key==='Enter') enviarMensaje()"
        >

        <button onclick="enviarMensaje()">
            ➤
        </button>

    </div>

</div>

<script>

function obtenerHora(){
    let fecha = new Date();

    return fecha.getHours().toString().padStart(2,'0')
        + ":"
        + fecha.getMinutes().toString().padStart(2,'0');
}

// poner hora en el mensaje de bienvenida
window.onload = function(){
    document.getElementById("hora-bienvenida").innerText = obtenerHora();
};

async function enviarMensaje(){

    let input = document.getElementById("mensaje");
    let texto = input.value;

    if(texto.trim() === ""){
        return;
    }

    let chatBox = document.getElementById("chat-box");

    // MENSAJE USUARIO
    let mensajeUsuario = document.createElement("div");
    mensajeUsuario.className = "mensaje usuario";

    mensajeUsuario.innerHTML = `
        ${texto}
        <span class="hora">${obtenerHora()}</span>
    `;

    chatBox.appendChild(mensajeUsuario);

    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    // ENVIAR AL SERVIDOR
    let respuesta = await fetch("/mensaje",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            mensaje:texto
        })
    });

    let datos = await respuesta.json();

    // RESPUESTA BOT
    let mensajeBot = document.createElement("div");
    mensajeBot.className = "mensaje bot";

    mensajeBot.innerHTML = `
         ${datos.respuesta.replace(/\n/g, "<br>")}
        <span class="hora">${obtenerHora()}</span>
    `;

    chatBox.appendChild(mensajeBot);

    chatBox.scrollTop = chatBox.scrollHeight;
}

</script>

</body>
</html>
